# Credits-independent submission build: GitHub-hosted runner builds the ROCm
# image and pushes to GHCR. Public repo = free. No DevCloud, no local docker.
# Trigger manually per mini-challenge (tag the release you submit).
name: build-submit-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. mini3)"
        default: "mini3"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: verify torch is still ROCm (the documented trap)
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ inputs.tag }} \
            python3 -c "import torch; v=torch.__version__; print(v); assert v.endswith('+rocm'), v"
